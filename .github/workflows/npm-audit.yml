name: npm audit

on:
  # Weekly, not daily: this job catches advisory *drift* against pinned versions,
  # which moves on a weekly cadence. A daily run on a repo that changes in bursts
  # just re-reports the same finding six extra times — as it did for 12 days
  # straight before 0.2.0.
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    # Backstop for the whole job, matching ci.yml. Without it the default is
    # GitHub's 360-minute ceiling. This job runs on a schedule, so a hung run
    # burns six runner-hours with nobody watching — the least visible place to
    # have no cap. An install plus two audits is a couple of minutes; 15 absorbs
    # a cold cache or a slow registry while still failing usefully.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs to push; do not leave the token in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Upstream's script: npm audit --omit=dev at moderate, minus advisories reviewed
      # and accepted in the script with a recorded reason.
      - name: Audit production vulnerabilities
        run: node scripts/npm-audit.mjs

      - name: Verify registry signatures
        run: npm audit signatures --omit=dev
