# E2, the context engine's simulation with real tokenizers, weekly: the self-test and the default
# matrix of run-e2.sh (4 mixes x 2 tokenizers x 3 windows x {reject, silent-front, silent-messages,
# reasoning}, 500 turns each) against the engine PENpi ships (.pi/extensions/penpi/engine). No provider
# keys or secrets: every model call is answered by Pi's faux provider. Network: the npm registry and
# huggingface.co (GLM-5.3-Flash tokenizer files at a pinned revision, checked by SHA-256). The job fails
# when any E2 run fails; the results are uploaded either way.
name: E2 context engine

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      E2_WORKERS: "4"
      E2_OUT: ${{ github.workspace }}/e2-results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # E2 reads its corpus from the upstream base commit (the base: line of docs/UPSTREAM_PATCHES.txt,
          # reachable through the recorded upstream merge), which a depth-1 clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - name: Upstream base is present
        run: git cat-file -e "$(awk '/^base:/ {print $2}' docs/UPSTREAM_PATCHES.txt)^{commit}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build (offline)
        run: npm run build:offline

      - name: Run E2
        working-directory: packages/coding-agent
        run: test/suite/context-engine-e2/run-e2.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2-results
          path: ${{ github.workspace }}/e2-results
