name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Not carried from upstream Pi's CI, deliberately:
# - The pi-env Rust daemon build. PENpi does not ship the daemon; packages/env skips its
#   daemon tests with a warning when no binary is built (packages/env/vitest.config.ts).
# - The mcp-conformance job. It tests Pi's built-in MCP client, which PENpi disables
#   (`-builtin:mcp` in the settings the installer writes); PENpi's MCP runs through the
#   embedded pi-mcp-adapter instead.
jobs:
  # Which test sets this run needs, from the paths it changes (scripts/ci-changed-paths.sh, plain git). The jobs
  # skip with an `if`, never a workflow-level paths filter: a required check that never reports blocks the merge,
  # and a skipped job counts as passing. Release branches, tags and manual runs get the full set, and so does any
  # run whose outputs are missing: a failed filter runs everything rather than nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upstream: ${{ steps.paths.outputs.upstream }}
      engine: ${{ steps.paths.outputs.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base commit to compare with: a pull request's base, or a push's previous head.
          fetch-depth: 0
          persist-credentials: false

      - name: Changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-changed-paths.sh

  build-check-test:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Backstop for the whole job. Without it the default is GitHub's 360-minute
    # ceiling, so any hung step burns six runner-hours before anyone finds out.
    # Observed runs are 3-9 minutes, so 30 absorbs a cold cache or a slow runner
    # while still failing in a useful timeframe. The apt step carries its own
    # tighter cap below, since that is the one that has actually stalled.
    # 0.5.0 added the context engine suite (about 7 minutes on 2 cores): 40.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs to push; do not leave the token in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Runs the release workflow's archive script on every PR, before anything writes to
      # the tree (it refuses a dirty tree), so a broken release script fails here and not
      # on release day.
      - name: Release archive dry run
        run: ./scripts/make-review-archive.sh HEAD "${RUNNER_TEMP}/penpi-ci-source.zip"

      # Capped because this step has hung on an unresponsive apt mirror: PR #12 sat
      # here for 6h0m43s until GitHub's job ceiling killed it, having never reached
      # npm. It normally completes in well under a minute, so 10 minutes is generous
      # while turning a stuck mirror into a fast, obvious failure instead of six
      # wasted runner-hours.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Offline build: PENpi commits the generated model-data snapshot, so CI builds
      # from it instead of regenerating it from live provider APIs.
      - name: Build (offline)
        run: npm run build:offline

      # The steps below mirror `npm run check`, split so a failure names the check.
      # Biome runs without --write so formatting drift fails instead of being fixed.
      - name: Biome
        run: npx biome check --error-on-warnings .

      - name: Check pinned deps
        run: npm run check:pinned-deps

      - name: Lockfile version check
        run: npm run check:lockfile-versions

      - name: Invoked shell scripts are executable
        run: npm run check:script-modes

      # Every path that differs from the upstream Pi base must be listed with a reason in
      # docs/UPSTREAM_PATCHES.txt (fetches the base commit by SHA in this shallow checkout).
      - name: Upstream patch manifest
        run: npm run check:upstream-patches

      - name: Check runtime deps
        run: npm run check:runtime-deps

      - name: Check TypeScript imports
        run: npm run check:ts-imports

      - name: Check entry graphs
        run: npm run check:entry-graphs

      - name: Check install lock
        run: npm run check:install-lock:coding-agent

      - name: TypeScript compile
        run: npx tsc --noEmit

      - name: Examples type check
        run: npx tsc --noEmit -p packages/coding-agent/examples/tsconfig.json

      - name: PENpi type check
        run: npm run check:penpi

      - name: Browser smoke check
        run: npm run check:browser-smoke

      # The context engine suite (part of npm test) counts with a real tokenizer (o200k_base): installs
      # it from the lockfile next to the script, plus the GLM tokenizer files from huggingface.co at the
      # pinned revision 91b69215, each checked by SHA-256 (E2 uses both).
      - name: Context engine tokenizers
        timeout-minutes: 10
        run: npm run setup:tokenizers

      # npm test in two parts, both isolated (./test.sh): PENpi's tests on every run, upstream's packages/* suites
      # only when the changes job says they could be affected.
      - name: Test
        run: ./test.sh test:scripts test:extension test:context-engine

      - name: Test upstream packages
        if: ${{ needs.changes.outputs.upstream != 'false' }}
        run: ./test.sh test:packages

  # The context engine is a plain Pi extension: its suite must pass against stock upstream Pi at the recorded
  # base, without PENpi's core patches (ADR 0032). The script checks the base out as a worktree, copies the
  # engine and the suite in, builds upstream offline with the fork's committed model data, and runs the suite.
  engine-on-upstream:
    needs: changes
    # Only when upstream's packages, the engine, its suite script or the E2 corpus pin change (the changes job).
    if: ${{ !cancelled() && needs.changes.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upstream base commit, reachable through the recorded upstream merge.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Context engine tokenizers
        timeout-minutes: 10
        run: npm run setup:tokenizers

      - name: Engine suite on stock upstream Pi
        run: scripts/engine-suite-upstream.sh

      # The E2 corpus pin (the e2-corpus: line): the corpus read from the pinned commit must have the pinned
      # fingerprint. CI's main job checks out at depth 1, where the test skips; this job has the full history.
      - name: E2 corpus pin
        working-directory: packages/coding-agent
        env:
          E2_PIN_REQUIRED: "1"
        run: npx vitest --run test/suite/context-engine-e2/corpus-pin.test.ts

      # The Claude counts test on the full sweep (the main job's npm test runs the default sweep). It re-prices the
      # committed counts with this tree's floor: no network and no tokenizer. Here, beside the longer main job, it
      # adds no time to the run. It needs only the install, so it runs when a step after the install fails.
      - name: Claude counts, full sweep
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/coding-agent
        timeout-minutes: 15
        env:
          FLOOR_SWEEP_FULL: "1"
        run: npx vitest --run --config test/suite/context-engine/vitest.config.ts test/suite/context-engine/claude-counts.test.ts
