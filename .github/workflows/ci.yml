name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    # Backstop for the whole job. Without it the default is GitHub's 360-minute
    # ceiling, so any hung step burns six runner-hours before anyone finds out.
    # Observed runs are 3-9 minutes, so 30 absorbs a cold cache or a slow runner
    # while still failing in a useful timeframe. The apt step carries its own
    # tighter cap below, since that is the one that has actually stalled.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Capped because this step has hung on an unresponsive apt mirror: PR #12 sat
      # here for 6h0m43s until GitHub's job ceiling killed it, having never reached
      # npm. It normally completes in well under a minute, so 10 minutes is generous
      # while turning a stuck mirror into a fast, obvious failure instead of six
      # wasted runner-hours.
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
