name: Release

# PENpi fork: releases are manual, restricted to a validated tag on base main,
# and ship SOURCE ONLY — see the Build source archive step for why.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.12.0)'
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${RELEASE_TAG}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # PENpi is installed from source (scripts/penpi-global.sh symlinks a clone),
      # so the release ships the source, not binaries.
      #
      # This job previously ran the inherited Pi binary builder. That builder
      # packages packages/coding-agent and has never copied .pi/extensions/penpi,
      # so every attached asset was upstream Pi — the published v0.2.0 archive
      # identifies itself as @earendil-works/pi-coding-agent 0.83.0 with no PENpi
      # in it. Attaching those under a PENpi tag misrepresents what a user
      # downloads, so they are no longer built or attached.
      #
      # If real PENpi binaries are wanted later, they must contain the extension,
      # an installer/status path and the docs, and scripts/check-release-assets.mjs
      # is the interlock that proves it before anything is published.
      - name: Build source archive
        run: |
          ./scripts/make-review-archive.sh "${RELEASE_TAG}" "penpi-${RELEASE_TAG}-source.zip"

      - name: Extract release notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          # --strict: refuse to publish the "Release <version>" placeholder. Two
          # releases shipped empty notes because the fallback exits 0.
          node scripts/release-notes.mjs extract \
            --version "${VERSION}" \
            --tag "${RELEASE_TAG}" \
            --changelog CHANGELOG.md \
            --repo penfieldlabs/PENpi \
            --base-path . \
            --strict \
            --out /tmp/release-notes.md
          test -s /tmp/release-notes.md
          if grep -qx "Release ${VERSION}" /tmp/release-notes.md; then
            echo "Release notes are the placeholder; refusing to publish." >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=("penpi-${RELEASE_TAG}-source.zip")
          sha256sum "${assets[@]}" > SHA256SUMS
          assets+=(SHA256SUMS)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --notes-file /tmp/release-notes.md
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file /tmp/release-notes.md \
              "${assets[@]}"
          fi
